{% extends "base.html" %}
{% block title %}Montaj Formu - ALGI BİLİŞİM{% endblock %}
{% block content %}

<div class="sayfa-basligi no-print">
    <h2>Montaj Formu{% if baslik %} — {{ baslik }}{% endif %}</h2>
    <div style="display:flex; gap:8px;">
        <a class="btn" href="{{ geri_url }}">Geri Dön</a>
        <button type="button" class="btn btn-yesil" onclick="window.print()">Yazdır</button>
    </div>
</div>

<style>
@media print {
    /* Sol kenar boşluğu diğerlerinden daha geniş: dosyayı klasöre takarken
       delgeçle (zımba/dosya deliği) delindiğinde yazılara zarar vermesin diye. */
    @page { size: A4; margin: 10mm 10mm 10mm 20mm; }
    body { margin: 0; }
}
.montaj-formu-sayfa {
    background: #fff;
    max-width: 900px;
    margin: 0 auto 20px;
    padding: 10px;
    border: 1px solid #dfe6e1;
    border-radius: 8px;
}
@media print {
    .montaj-formu-sayfa {
        border: none;
        border-radius: 0;
        max-width: none;
        margin: 0;
        padding: 0;
        /* Word'den yüklenen tasarımlar ekrandaki normal yazı boyutuyla geldiğinde
           iki kopya bir A4 sayfasına sığmayabiliyor — yazdırırken (sadece
           yazdırırken; ekranda önizleme normal boyutta kalır) küçültüyoruz.
           font-size TEK BAŞINA yeterli olmuyordu çünkü hücre iç boşlukları/
           kenarlıklar gibi bazı ölçüler piksel cinsinden SABİT (yazı boyutuyla
           birlikte küçülmüyor) — bu yüzden TÜM tasarımı (yazı + boşluk + kenarlık
           + görsel) aynı oranda küçülten "zoom" kullanılıyor; bu, farklı
           bilgisayar/yazıcı sürücülerindeki küçük ölçü farklarına karşı da (font
           satır yüksekliği vb.) çok daha güvenli bir pay bırakıyor. */
        font-size: 10px;
        zoom: 0.98;
        page-break-after: always;
    }
    .montaj-formu-sayfa:last-child { page-break-after: auto; }
}
/* İki kopya arasındaki kesim çizgisi: kağıdı buradan ikiye kestiğinizde, her
   iki kopya kendi kenarına göre TAM aynı hizada kalsın diye çizginin üstünde
   ve altında EŞİT boşluk bırakılıyor (kopyalar zaten birebir aynı içerik/CSS
   olduğu için eşit boyda basılıyor — çizgi tam ortalarında kalıyor). */
.kesim-cizgisi {
    height: 0;
    margin: 6px 0;
    border-top: 1px dashed #999;
}
</style>

{% for sayfa in sayfalar %}
<div class="montaj-formu-sayfa">
    {{ sayfa|safe }}
    <div class="kesim-cizgisi" aria-hidden="true"></div>
    {{ sayfa|safe }}
</div>
{% endfor %}
{% endblock %}
